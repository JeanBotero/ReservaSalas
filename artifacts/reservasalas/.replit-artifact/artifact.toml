kind = "web"
previewPath = "/"
title = "ReservaSalas"
description = "Prototipo web en español para que estudiantes y personal universitario consulten la disponibilidad y reserven salas, con persistencia local en el navegador."
version = "1.0.0"
id = "artifacts/reservasalas"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24734

[services.development]
run = "pnpm --filter @workspace/reservasalas run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/reservasalas", "run", "build" ]
serve = "static"
publicDir = "artifacts/reservasalas/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24734"
BASE_PATH = "/"
